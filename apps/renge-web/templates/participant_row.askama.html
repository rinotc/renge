<div id="participant-{{ person.id }}" class="flex flex-col gap-3 rounded-box border border-base-300 p-4 sm:flex-row sm:items-center">
    <div class="min-w-0 flex-1">
        <div class="font-semibold">{{ person.name }}</div>
        <div class="truncate text-sm text-base-content/60">{{ person.email }}</div>
    </div>
    <span class="badge {{ person.status.class }}">{{ person.status.label }}</span>
    <select class="select select-bordered select-sm" name="attendance" hx-trigger="change" hx-post="/events/{{ event_id }}/participants/{{ person.id }}/attendance" hx-target="#participant-{{ person.id }}" hx-swap="outerHTML">
        {% for option in attendance_options %}
        <option value="{{ option.value }}"{% if option.value == person.status.value %} selected{% endif %}>{{ option.label }}</option>
        {% endfor %}
    </select>
    <button class="btn btn-ghost btn-sm text-error" hx-delete="/events/{{ event_id }}/participants/{{ person.id }}" hx-target="#participant-{{ person.id }}" hx-swap="outerHTML" hx-confirm="この参加者を削除しますか？">削除</button>
</div>
