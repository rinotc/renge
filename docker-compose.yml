services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: renge
      POSTGRES_USER: renge
      POSTGRES_PASSWORD: renge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renge -d renge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
